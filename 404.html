<!-- @format -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Page Not Found | SafePlots</title>
        <link rel="icon" type="image/png" href="assets/icons/favicon.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap"
        />

        <link rel="stylesheet" href="style.css" />
        <style>
            .error-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 70vh;
                text-align: center;
                padding: 2rem;
            }

            .error-code {
                font-size: clamp(5rem, 15vw, 10rem);
                font-weight: 900;
                line-height: 1;
                margin: 0;
                color: var(--color-black);
                font-family: "Space Mono", monospace;
            }

            .error-message {
                font-size: 1.5rem;
                margin: 1rem 0 2rem;
                max-width: 500px;
                color: var(--color-text-light);
            }

            .error-kicker {
                background: var(--color-orange-faint);
                color: var(--color-orange);
                padding: 0.5rem 1rem;
                border-radius: 4px;
                font-weight: 700;
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body class="page-legal">
        <!-- Header -->
        <header class="header">
            <div class="header-container">
                <a href="index.html" class="logo">SafePlots</a>
                <nav class="nav-links text-mono">
                    <a href="index.html">Home</a>
                    <a href="index.html#services">Services</a>
                    <a href="index.html#contact">Contact</a>
                </nav>
            </div>
        </header>

        <main class="container">
            <div class="error-content">
                <div class="error-kicker text-mono">ERROR</div>
                <h1 class="error-code">404</h1>
                <p class="error-message">
                    The plot you are looking for has been moved, removed, or
                    never existed. Let's get you back on safe ground.
                </p>
                <div class="header-actions">
                    <a href="index.html" class="btn btn-black">Back to Home</a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="container">
                <div class="footer-bottom-bar">
                    <div class="copyright">
                        <small
                            >&copy; 2026 SafePlots. All rights reserved.</small
                        >
                    </div>
                </div>
            </div>
        </footer>
    </body>
</html>
