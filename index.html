<!-- @format -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- PWA & Mobile Meta -->
        <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
        <link rel="apple-touch-icon" href="assets/icons/favicon.png" />
        <meta name="theme-color" content="#ff4400" />
        <link rel="manifest" href="manifest.json" />
        <link rel="canonical" href="https://safeplots.com" />

        <!-- SEO Meta Tags -->
        <title>
            SafePlots | NRI Plot Monitoring, Fencing & VLT Services Hyderabad
        </title>
        <meta
            name="description"
            content="Trusted NRI plot management & Fencing (Precast/Wire). Services: VLT, Legal, Cleaning & Satellite Monitoring. View Survey Maps & Lakes on our App."
        />
        <meta name="author" content="SafePlots" />

        <!-- Open Graph Tags -->
        <meta property="og:site_name" content="SafePlots" />
        <meta property="og:url" content="https://safeplots.com" />
        <meta
            property="og:title"
            content="SafePlots | NRI Plot Monitoring, Fencing & VLT Services Hyderabad"
        />
        <meta
            property="og:description"
            content="Trusted NRI plot management & Fencing (Precast/Wire). Services: VLT, Legal, Cleaning & Satellite Monitoring. View Survey Maps & Lakes on our App."
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:image"
            content="https://safeplots.com/assets/images/og-image.png"
        />
        <meta property="og:image:alt" content="SafePlots Dashboard Preview" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="SafePlots | NRI Plot Monitoring, Fencing & VLT Services Hyderabad"
        />
        <meta
            name="twitter:description"
            content="Trusted NRI plot management & Fencing (Precast/Wire). Services: VLT, Legal, Cleaning & Satellite Monitoring. View Survey Maps & Lakes on our App."
        />
        <meta
            name="twitter:image"
            content="https://safeplots.com/assets/images/og-image.png"
        />
        <meta name="twitter:image:alt" content="SafePlots Dashboard Preview" />

        <!-- Robots meta -->
        <meta name="robots" content="index, follow" />

        <!-- Structured Data (JSON-LD) -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "SafePlots",
                "url": "https://safeplots.com",
                "logo": "https://safeplots.com/assets/icons/favicon.png",
                "description": "Trusted NRI plot management & Fencing (Precast/Wire). Services: VLT, Legal, Cleaning & Satellite Monitoring. View Survey Maps & Lakes on our App.",
                "areaServed": {
                    "@type": "City",
                    "name": "Hyderabad"
                },
                "knowsAbout": [
                    "Plot Fencing",
                    "Vacant Land Tax (VLT)",
                    "Satellite Monitoring",
                    "Legal Verification",
                    "Survey Maps",
                    "Cadastral Maps",
                    "Hyderabad Lakes"
                ],
                "sameAs": []
            }
        </script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Header -->
        <header class="header">
            <div class="header-container">
                <div class="logo">SafePlots</div>

                <button class="mobile-toggle" aria-label="Toggle Menu">
                    ☰
                </button>

                <nav class="nav-links text-mono">
                    <a href="#monitoring">Monitoring</a>
                    <a href="#features">Services</a>
                    <a href="#features">Features</a>
                    <a href="#pricing">Pricing</a>
                </nav>

                <div class="header-actions text-mono">
                    <a href="#" class="btn btn-black">Login / Signup</a>
                </div>
            </div>
        </header>

        <!-- Footer -->
        <footer class="footer-cta">
            <div class="container text-center">
                <div class="footer-bottom">
                    <div class="copyright">
                        © 2026 SafePlots. MADE IN INDIA.
                    </div>

                    <div class="footer-nav-groups">
                        <!-- Legal -->
                        <div class="footer-group">
                            <a href="#">TERMS</a>
                            <a href="#">PRIVACY</a>
                        </div>

                        <!-- Support -->
                        <div class="footer-group">
                            <a href="#">FAQ</a>
                            <a href="#">BLOG</a>
                            <a href="#">CONTACT</a>
                        </div>

                        <!-- Socials -->
                        <div class="footer-group socials">
                            <a href="#" title="X (Twitter)">𝕏</a>
                            <a href="#" title="Instagram">📸</a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
